name: WorkWise CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─── API Tests ─────────────────────────────────────────────────────────────
  api-check:
    name: API — Type Check, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workwise
          POSTGRES_PASSWORD: workwise_test
          POSTGRES_DB: workwise_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workwise:workwise_test@localhost:5432/workwise_test
      JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long
      JWT_REFRESH_SECRET: test_refresh_secret_must_be_at_least_32_chars_long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      PORT: 4001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install Prisma globally
        run: npm install -g prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run migrations (test DB)
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: TypeScript type check
        working-directory: apps/api
        run: npm run typecheck

      - name: Run unit tests
        working-directory: apps/api
        run: npm run test:unit

      - name: Run integration tests
        working-directory: apps/api
        run: npm run test:integration

      - name: Build API
        working-directory: apps/api
        run: npm run build

  # ─── Frontend Tests ────────────────────────────────────────────────────────
  web-check:
    name: Web — Type Check, Lint & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript type check
        working-directory: apps/web
        run: npm run typecheck

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

  # ─── Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [api-check, web-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          tags: workwise-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          tags: workwise-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.workwise.example.com/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
